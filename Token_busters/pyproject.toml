[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cx-agent"
version = "0.1.0"
description = "Backend-first Agentic CX Intelligence MVP"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Token Busters" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.scripts]
cx-agent = "cx_agent.cli.main:main"
cx-agent-api = "cx_agent.api.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
